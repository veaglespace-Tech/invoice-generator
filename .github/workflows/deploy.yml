name: Deploy Invoice Generator

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          timeout: 180s
          command_timeout: 30m

          script: |
            set -e

            echo "======================================"
            echo "Starting Invoice Generator Deployment"
            echo "======================================"

            cd /root/invoice-generator

            echo "=== Pull latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing backend dependencies ==="
            cd /root/invoice-generator/server
            npm install

            echo "=== Generating Prisma Client ==="
            npx prisma generate

            echo "=== Syncing database schema ==="
            npx prisma db push

            echo "=== Installing frontend dependencies ==="
            cd /root/invoice-generator/client
            npm install

            echo "=== Building frontend ==="
            npm run build

            echo "=== Restarting backend ==="
            pm2 restart invoice-backend

            echo "=== Restarting frontend ==="
            pm2 restart invoice-frontend

            echo "=== Saving PM2 ==="
            pm2 save

            echo "======================================"
            echo "Invoice Generator Deployment Completed"
            echo "======================================"
